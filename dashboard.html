pages.activity.init = async () => {
  const ANS = { sent: '📨 menunggu', 'dm-closed': '🔒 DM tertutup', yes: '✅ masih aktif', izin: '⏸️ izin/sibuk', leave: '👋 mau keluar' };
  const VIEWS = [['member_inactive', 'Member tidak aktif'], ['member_active', 'Member aktif'], ['visitor_inactive', 'Visitor tidak aktif'], ['visitor_active', 'Visitor aktif'], ['empty', 'Akun kosong']];
  let view = sessionStorage.getItem('ac-view') || 'member_inactive', list = [], counts = {};
  const first = await api('/members/activity?days=99999');
  const conf = first.cfg; $('#ac-days').value = conf.inactiveDays; $('#ac-msg').value = conf.checkMessage; $('#ac-ign').innerHTML = roleChips('ac-ignc', conf.ignoreRoleIds || []);
  const picked = () => [...document.querySelectorAll('.ac-cb:checked')].map((c) => c.value);
  const tabs = () => { $('#ac-tabs').innerHTML = VIEWS.map(([k, n]) => `<button class="${k === view ? 'on' : ''}" data-v="${k}">${n} <span style="opacity:.7">${counts[k] ?? ''}</span></button>`).join(''); document.querySelectorAll('#ac-tabs button').forEach((b) => b.onclick = () => { view = b.dataset.v; sessionStorage.setItem('ac-view', view); load(); }); };
  const draw = () => {
    $('#ac-title').textContent = VIEWS.find(([k]) => k === view)[1]; $('#ac-n').textContent = `${list.length} orang`;
    $('#ac-list').innerHTML = list.length ? list.map((m) => `<tr><td><input type="checkbox" class="ac-cb" value="${m.id}" style="width:auto"></td><td><div class="row" style="gap:8px;flex-wrap:nowrap"><img src="${esc(m.avatar)}" style="width:28px;height:28px;border-radius:50%"><div><b>${esc(m.name)}</b><div class="hint">@${esc(m.username)}</div></div></div></td><td>${m.roles.map((r) => `<span class="tag" style="border-left:3px solid ${r.color}">${esc(r.name)}</span>`).join(' ') || '<span class="hint">tanpa role</span>'}</td><td>${m.lastActive ? fmtDT(m.lastActive) : '<span class="hint">belum tercatat</span>'}</td><td><b>${m.idleDays}</b> hari</td><td>${m.msgs}</td><td>${m.flags.map((f) => `<span class="tag">${esc(f)}</span>`).join(' ') || '<span class="hint">—</span>'}</td><td>${m.check ? (ANS[m.check.status] || m.check.status) : '—'}</td></tr>`).join('') : emptyRow(8, view === 'empty' ? 'Tidak ada akun kosong.' : view.endsWith('inactive') ? 'Tidak ada yang tidak aktif.' : 'Belum ada data.');
  };
  const load = async () => { const r = await api(`/members/list?view=${view}&days=${$('#ac-days').value}`); list = r.list; counts = r.counts; tabs(); draw(); tidyText($('#root')); };
  const scanSt = async () => { const r = await api('/members/scan').catch(() => null); if (!r || !$('#ac-scan-st')) return; if (r.running) { $('#ac-scan-st').textContent = `Scan ${r.done}/${r.channels} channel…`; setTimeout(scanSt, 3000); } else { $('#ac-scan-st').textContent = r.scannedAt || r.messages ? 'Riwayat chat sudah di-scan' : 'Riwayat chat belum di-scan'; if (r.messages) load(); } };
  tabs(); await load(); scanSt();
  $('#ac-load').onclick = (e) => busy(e.target, load);
  $('#ac-scan').onclick = (e) => busy(e.target, async () => { await api('/members/scan', { method: 'POST', body: {} }); toast('Scan riwayat chat dimulai'); setTimeout(scanSt, 1500); });
  $('#ac-all').onclick = () => { const cbs = [...document.querySelectorAll('.ac-cb')]; const on = cbs.some((c) => !c.checked); cbs.forEach((c) => c.checked = on); };
  $('#ac-save').onclick = (e) => busy(e.target, async () => { await api('/members/activity', { method: 'PUT', body: { inactiveDays: $('#ac-days').value, ignoreRoleIds: readChips('ac-ignc'), checkMessage: $('#ac-msg').value } }); toast('✅ Disimpan'); load(); });
  $('#ac-check').onclick = (e) => { const ids = picked(); if (!ids.length) return toast('Pilih member dulu', true); if (!confirm(`Kirim DM cek keaktifan ke ${ids.length} orang?`)) return; busy(e.target, async () => { await api('/members/activity/check', { method: 'POST', body: { userIds: ids } }); toast('📨 DM cek aktif sedang dikirim'); }); };
  const act = (action) => (e) => { const ids = picked(); const role = $('#ac-unrole').value; if (!ids.length) return toast('Pilih member dulu', true); if (action === 'unrole' && !role) return toast('Pilih role yang dicabut', true); if (!confirm(action === 'kick' ? `KICK ${ids.length} orang?` : `Cabut role @${roleName(role)} dari ${ids.length} orang?`)) return; busy(e.target, async () => { const r = await api('/members/activity/action', { method: 'POST', body: { userIds: ids, action, roleIds: [role] } }); toast(`✅ ${r.ok} orang diproses`); load(); }); };
  $('#ac-un').onclick = act('unrole'); $('#ac-kick').onclick = act('kick');
};

pages.directory.init = async () => {

  const drawX = () => {

      <div class="chips" style="margin-top:8px">${S.guild.roles.map((r) => `<span class="chip dx-r ${x.roleIds.includes(r.id) ? 'on' : ''}" data-id="${r.id}" style="border-left:3px solid ${r.color}">${x.roleIds.includes(r.id) ? `<b>${x.roleIds.indexOf(r.id) + 1}.</b> ` : ''}@${esc(r.name)}</span>`).join('')}</div></div>`).join('') : '<div class="hint">Belum ada struktur tambahan.</div>';
    document.querySelectorAll('#dx-list>.card').forEach((el) => { const i = +el.dataset.i;
      el.querySelector('.dx-t').oninput = (e) => extra[i].title = e.target.value; el.querySelector('.dx-n').oninput = (e) => extra[i].note = e.target.value; el.querySelector('.dx-c').onchange = (e) => extra[i].channelId = e.target.value; el.querySelector('.dx-m').onchange = (e) => extra[i].mode = e.target.value; el.querySelector('.dx-x').onchange = (e) => extra[i].excludeRoleIds = e.target.value ? [e.target.value] : [];

      el.querySelectorAll('.dx-r').forEach((c) => c.onclick = (ev) => { ev.stopPropagation(); const id = c.dataset.id; const k = extra[i].roleIds.indexOf(id); if (k >= 0) extra[i].roleIds.splice(k, 1); else extra[i].roleIds.push(id); drawX(); }); });

      <label>Pilihan jenis (jadi tombol, pisah koma — kosong = 1 tombol)</label><input class="f-types" value="${esc((f.types || []).join(', '))}" placeholder="Pelanggaran, Masalah Internal, Konflik">

    <div><label>Pertanyaan (maks 5)</label><div class="f-qs">${f.questions.map((q, j) => `<div class="card" style="padding:10px;margin-bottom:8px" data-j="${j}"><input class="q-label" value="${esc(q.label)}" placeholder="Pertanyaan (maks 45 huruf)" maxlength="45"><input class="q-ph" value="${esc(q.placeholder)}" placeholder="Contoh jawaban" style="margin-top:6px"><div class="row" style="margin-top:6px;gap:14px;font-size:13px"><label class="row" style="margin:0;text-transform:none"><input type="checkbox" class="q-long" ${q.long ? 'checked' : ''} style="width:auto"> jawaban panjang</label><label class="row" style="margin:0;text-transform:none"><input type="checkbox" class="q-req" ${q.required !== false ? 'checked' : ''} style="width:auto"> wajib</label><div class="spacer"></div><button class="small q-del">✕</button></div></div>`).join('')}</div>

    <div class="actions"><button class="primary f-post">Simpan & kirim panel</button></div></div>`;

      el.querySelector('.f-del').onclick = () => { if (!confirm('Hapus form ini?')) return; read(); items.splice(i, 1); draw(); };
      el.querySelector('.f-addq')?.addEventListener('click', () => { read(); items[i].questions.push(blankQ()); draw(); });
      el.querySelectorAll('.q-del').forEach((b) => b.onclick = () => { read(); items[i].questions.splice(+b.closest('[data-j]').dataset.j, 1); draw(); });
      el.querySelector('.f-post').onclick = (e) => busy(e.target, async () => { read(); const x = await api('/forms', { method: 'PUT', body: { items } }); items = x.items; const p = await api(`/forms/${items[i].id}/panel`, { method: 'POST', body: {} }); toast(`✅ Panel ${p.result === 'posted' ? 'dikirim' : 'diperbarui'}`); draw(); });
    });
    tidyText($('#root'));
  };
  draw();
  $('#fm-add').onclick = () => { read(); items.push({ name: 'Form baru', emoji: '📮', description: '', types: [], questions: [blankQ()], panelChannelId: '', targetChannelId: '', staffRoleIds: [], anonymous: false, enabled: true }); draw(); };
  $('#fm-save').onclick = (e) => busy(e.target, async () => { read(); const x = await api('/forms', { method: 'PUT', body: { items } }); items = x.items; toast('✅ Form disimpan'); draw(); });
  $('#fm-scan').onclick = (e) => busy(e.target, async () => {
    $('#fm-found').innerHTML = '<div class="hint loading" style="height:30px"></div>';
    const found = await api('/forms/scan');
    $('#fm-found').innerHTML = found.length ? found.map((x, k) => `<div class="feat" style="margin-bottom:8px;align-items:flex-start"><div style="flex:1"><b>#${esc(x.channel)}</b> <span class="hint">· ${esc(x.author)} · ${fmtDT(x.at)}</span><div class="hint" style="white-space:pre-wrap;margin-top:4px">${esc(x.preview.slice(0, 180))}${x.preview.length > 180 ? '…' : ''}</div></div><button class="small" data-mk="${k}">Jadikan form</button></div>`).join('') : '<div class="hint">Tidak ditemukan format manual lain. 👍</div>';
    document.querySelectorAll('[data-mk]').forEach((b) => b.onclick = () => { const x = found[+b.dataset.mk]; read();
      items.push({ name: x.channel.replace(/[^\p{L}\p{N} -]/gu, '').replace(/-/g, ' ').trim().replace(/\b\w/g, (c) => c.toUpperCase()).slice(0, 40) || 'Form', emoji: '📮', description: '', types: [], questions: (x.fields.length ? x.fields : ['Isi']).slice(0, 5).map((l) => ({ label: l.slice(0, 45), placeholder: '', long: /kronologi|alasan|jelaskan|detail|catatan/i.test(l), required: !/bukti|opsional/i.test(l) })), panelChannelId: '', targetChannelId: x.channelId, staffRoleIds: [], anonymous: false, enabled: true });
      draw(); toast('Form dibuat dari format — cek pertanyaannya, pilih channel panel, lalu Simpan & kirim panel'); });
  });
  const subs = r.subs; const fname = (id) => items.find((f) => f.id === id)?.name || '-';
  $('#fm-subs').innerHTML = subs.length ? subs.map((x) => `<tr><td>${x.no}</td><td>${esc(fname(x.formId))}${x.type ? `<div class="hint">${esc(x.type)}</div>` : ''}</td><td>${esc(x.username)}</td><td style="max-width:320px">${esc((x.answers[0]?.a || '').slice(0, 90))}</td><td>${esc(r.statuses[x.status] || x.status)}</td><td>${fmtDT(x.createdAt)}</td></tr>`).join('') : emptyRow(6, 'Belum ada kiriman.');
};

// ================== 🔒 CHANNEL READ-ONLY ==================
pages.readonly = () => `<h1>🔒 Channel Read-only</h1><div class="sub">Channel info & panel (pengumuman, rules, price list, panduan, panel tombol, dll) dibuat read-only: member tetap bisa baca dan klik tombol, tapi tidak bisa chat. Yang bisa posting cuma bot dan staff (role dengan izin Administrator / Manage Messages, plus role pilihan di bawah).</div>
  <div class="card"><label>Role tambahan yang tetap boleh posting di channel read-only</label><div id="ro-roles"></div>
    <div class="actions"><button id="ro-sug">Pilih yang disarankan</button><button class="primary" id="ro-on">🔒 Kunci yang dipilih</button><button id="ro-off">🔓 Buka yang dipilih</button><span class="hint" id="ro-n"></span></div></div>
  <div class="card" style="margin-top:16px;padding:0;overflow:auto"><table><thead><tr><th></th><th>Channel</th><th>Kategori</th><th>Status</th><th>Catatan</th></tr></thead><tbody id="ro-list"></tbody></table></div>`;
pages.readonly.init = async () => {
  let r = await api('/channels/readonly');
  $('#ro-roles').innerHTML = roleChips('ro-rc', r.staffRoleIds || []);
  const draw = () => { $('#ro-list').innerHTML = r.items.map((c) => `<tr><td><input type="checkbox" class="ro-cb" value="${c.id}" style="width:auto"></td><td><b>#${esc(c.name)}</b></td><td class="hint">${esc(c.parent)}</td><td>${c.readonly ? '<span class="tag">🔒 read-only</span>' : '<span class="hint">bisa chat</span>'}</td><td class="hint">${c.suggest && !c.readonly ? 'disarankan dikunci' : ''}${c.privateCh ? ' · channel privat' : ''}</td></tr>`).join('');
    $('#ro-n').textContent = `${r.items.filter((c) => c.readonly).length} channel read-only`; };
  draw();
  const picked = () => [...document.querySelectorAll('.ro-cb:checked')].map((c) => c.value);
  $('#ro-sug').onclick = () => { const s = new Set(r.items.filter((c) => c.suggest).map((c) => c.id)); document.querySelectorAll('.ro-cb').forEach((cb) => cb.checked = s.has(cb.value)); };
  const run = (on) => (e) => { const ids = picked(); if (!ids.length) return toast('Pilih channel dulu', true); if (!confirm(`${on ? 'Kunci' : 'Buka'} ${ids.length} channel?`)) return; busy(e.target, async () => { const x = await api('/channels/readonly', { method: 'POST', body: { channelIds: ids, readonly: on, staffRoleIds: readChips('ro-rc') } }); toast(`✅ ${x.done.length} channel ${on ? 'dikunci' : 'dibuka'}${x.fail.length ? ` · ${x.fail.length} gagal` : ''}`); r = await api('/channels/readonly'); draw(); }); };
  $('#ro-on').onclick = run(true); $('#ro-off').onclick = run(false);
};

// ================== efek animasi ==================
const fx = (() => {
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let booted = false; const t0 = Date.now();
  const hideIntro = () => { const el = $('#intro'); if (!el) return; setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 700); }, calm ? 0 : Math.max(0, 1700 - (Date.now() - t0))); };
  document.addEventListener('click', (e) => { if (e.target.closest('#intro')) $('#intro')?.classList.add('out'); }, true);

  // angka naik
  const countUp = (el) => {
    const node = [...el.childNodes].find((n) => n.nodeType === 3 && /^\s*\d+\s*$/.test(n.textContent)); if (!node) return;
    const end = +node.textContent, dur = 900, st = performance.now();
    const step = (now) => { const k = Math.min(1, (now - st) / dur), e = 1 - Math.pow(1 - k, 3); node.textContent = Math.round(end * e); if (k < 1) requestAnimationFrame(step); };
    node.textContent = '0'; requestAnimationFrame(step);
  };

  const page = () => {
    const root = $('#root');
    if (!booted) { root.firstElementChild?.classList.add('boot'); booted = true; setTimeout(() => root.firstElementChild?.classList.remove('boot'), 2200); }
    root.querySelectorAll('.nav a,.navgroup').forEach((a, i) => a.style.setProperty('--i', i));
    const c = $('.content'); if (!c) return;
    [...c.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 8)));
    c.querySelectorAll('.grid').forEach((g) => [...g.children].forEach((el, j) => el.style.setProperty('--j', Math.min(j, 12))));
    const h = c.querySelector('h1'); if (h && theme() === 'ordo') h.classList.add('shine');
    if (!calm && theme() === 'ordo') c.querySelectorAll('.stat .num:not(.emo)').forEach(countUp);
  };

  // cahaya ikut kursor di kartu
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest?.('.tile,.feat,.card.stat'); if (!el) return;
    const r = el.getBoundingClientRect(); el.style.setProperty('--mx', e.clientX - r.left + 'px'); el.style.setProperty('--my', e.clientY - r.top + 'px');
  }, { passive: true });

  // riak klik di tombol
  document.addEventListener('pointerdown', (e) => {
    if (calm) return; const b = e.target.closest?.('button,a.btn'); if (!b) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement('span');
    sp.className = 'ripple'; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    b.append(sp); setTimeout(() => sp.remove(), 650);
  });

  // partikel emas melayang (ringan, berhenti saat tab tidak aktif)
  const cv = $('#motes');
  if (cv && !calm && theme() === 'ordo') {
    const ctx = cv.getContext('2d'); let W, H, dots = [];
    const size = () => { const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dots = Array.from({ length: Math.round(W * H / 38000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .4, v: Math.random() * .25 + .06, a: Math.random() * Math.PI * 2, s: Math.random() * .02 + .005 })); };
    size(); addEventListener('resize', size);
    const tick = () => {
      if (!document.hidden) {
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          d.y -= d.v; d.a += d.s; d.x += Math.sin(d.a) * .25; if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
          const o = .25 + Math.sin(d.a * 2) * .2;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fillStyle = `rgba(233,209,139,${o})`; ctx.shadowColor = 'rgba(233,209,139,.8)'; ctx.shadowBlur = 6; ctx.fill();
        }
      }
      requestAnimationFrame(tick);
    };
    tick();
  }
  return { page, hideIntro };
})();

// ================== router ==================
function render() {
  const [page, sub] = (location.hash.slice(1) || 'home').split('/');
  S.page = pages[page] && (S.me.pages || []).includes(page) ? page : 'home';
  if (S.page === 'posts' && sub) S.postKey = sub;
  $('#root').innerHTML = layout(pages[S.page]());
  tidyText($('#root'));
  Promise.resolve(pages[S.page].init?.()).finally(() => tidyText($('#root')));
  window.scrollTo(0, 0);
  fx.page();
}
window.onhashchange = render;

function loginScreen() {
  const err = new URLSearchParams(location.search).get('error');
  const msg = { noaccess: '⛔ Akun kamu tidak punya akses. Dashboard hanya untuk staff dengan izin "Manage Server" di THE RESILIENT ORDER.', state: 'Sesi login kadaluarsa, coba lagi.', token: 'Login gagal (cek CLIENT_SECRET & Redirect di Developer Portal).', login: 'Login gagal, coba lagi.' }[err];
  $('#root').innerHTML = `<div class="login"><div class="box"><div class="owl"></div><h1>TRO SYSTEM</h1><div class="motto">In wisdom, we endure.</div><p>Ruang kendali The Resilient Order.<br>Masuk dengan akun Discord kamu.</p>${msg ? `<div class="err-box">${msg}</div>` : ''}<a class="btn" href="/login"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a20 20 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.3a14.2 14.2 0 0 0 12.2 0l.5.3-2 1 1.3 2a19.9 19.9 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>Login dengan Discord</a></div></div>`;
}

(async () => {
  S.me = await api('/me').catch(() => ({ user: null }));
  if (!S.me.allowed) { loginScreen(); return fx.hideIntro(); }
  [S.guild, S.cfg] = await Promise.all([api('/guild'), api('/config')]);
  if (!S.guild.channels) { $('#root').innerHTML = '<div class="login"><div class="box"><div class="owl">🦉</div><h1>Bot belum siap</h1><p>TRO SYSTEM masih menyambung ke Discord. Refresh halaman ini sebentar lagi.</p></div></div>'; return fx.hideIntro(); }
  const [apps, inv] = await Promise.all([api('/applications').catch(() => []), api('/invites').catch(() => null)]);
  S.pending = apps.filter((a) => a.status === 'pending').length;
  if (inv) { S.invToday = inv.items.filter((i) => i.date === inv.today).length; S.cfg.invitesLimit = [0, 6].includes(new Date(inv.today + 'T00:00:00Z').getUTCDay()) ? (inv.weekendLimit || '∞') : (inv.weekdayLimit || '∞'); }
  if (location.search) history.replaceState(null, '', '/' + location.hash);
  render();
  fx.hideIntro();
})();
</script>
