pages.access.init = async () => {
  const a = S.cfg.access;
  a.pages = a.pages || {};
  const info = await api('/access/users');
  const names = Object.fromEntries(info.users.map((u) => [u.id, u]));
  if (!a.roleIds.length) $('#ac-defhint').innerHTML = `Belum dipilih → otomatis pakai role <b>${info.defaultRoleIds.map((r) => '@' + esc(roleName(r))).join(', ') || 'ADMIN / OWNER (tidak ditemukan)'}</b>.`;
  const person = (u, removeCls) => `<a><span class="row" style="gap:8px">${u.avatar ? `<img src="${esc(u.avatar)}" style="width:26px;height:26px;border-radius:50%">` : ''}${esc(u.name || u.id)}${u.id === info.ownerId ? ' <span class="tag">Owner server</span>' : ''}</span>${removeCls ? `<button class="small danger ${removeCls}" data-id="${u.id}">✕</button>` : ''}</a>`;
  const draw = () => {
    $('#ac-users').innerHTML = a.userIds.map((id) => person(names[id] || { id }, 'ac-urm')).join('') || '<div class="hint">Belum ada orang tambahan.</div>';
    $('#ac-supers').innerHTML = [...new Set([info.ownerId, ...a.superAdminIds])].map((id) => person(names[id] || { id }, id === info.ownerId || id === S.me.user.id ? '' : 'ac-srm')).join('');
    document.querySelectorAll('.ac-urm').forEach((b) => b.onclick = (e) => { e.preventDefault(); a.userIds = a.userIds.filter((x) => x !== b.dataset.id); draw(); });
    document.querySelectorAll('.ac-srm').forEach((b) => b.onclick = (e) => { e.preventDefault(); a.superAdminIds = a.superAdminIds.filter((x) => x !== b.dataset.id); draw(); });
  };
  const search = (inp, box, onPick) => {
    let t;
    $(inp).oninput = () => { clearTimeout(t); t = setTimeout(async () => {
      const r = await api('/access/search?q=' + encodeURIComponent($(inp).value));
      $(box).innerHTML = r.map((u) => `<a data-id="${u.id}" style="cursor:pointer"><span class="row" style="gap:8px"><img src="${esc(u.avatar)}" style="width:26px;height:26px;border-radius:50%">${esc(u.name)} <small class="hint">@${esc(u.username)}</small></span><small>+ tambah</small></a>`).join('');
      $(box).querySelectorAll('a').forEach((el) => el.onclick = () => { const u = r.find((x) => x.id === el.dataset.id); names[u.id] = u; onPick(u.id); $(inp).value = ''; $(box).innerHTML = ''; draw(); });
    }, 250); };
  };
  search('#ac-q', '#ac-res', (id) => { if (!a.userIds.includes(id)) a.userIds.push(id); });
  search('#ac-sq', '#ac-sres', (id) => { if (!a.superAdminIds.includes(id)) a.superAdminIds.push(id); });
  const pageKeys = PAGES.flatMap(([, items]) => items.map(([k]) => k)).filter((k) => !['home', 'access'].includes(k));
  $('#ac-pages').innerHTML = pageKeys.map((k) => `<div style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg)"><div class="row" style="margin-bottom:6px"><b>${PAGE_NAMES[k]}</b><div class="spacer"></div><span class="hint" id="pg-st-${k}"></span></div>${roleChips('pg-' + k, a.pages[k] || [])}</div>`).join('');
  const st = () => pageKeys.forEach((k) => { const n = readChips('pg-' + k).length; $('#pg-st-' + k).textContent = n ? `🔒 ${n} role` : '🌐 semua'; });
  document.querySelector('#ac-pages').addEventListener('click', () => setTimeout(st, 0)); st();
  draw();
  $('#ac-save').onclick = (e) => busy(e.target, async () => {
    a.mode = $('#ac-mode').value; a.roleIds = readChips('ac-roles'); a.reviewerRoleIds = readChips('ac-rev');
    a.pages = Object.fromEntries(pageKeys.map((k) => [k, readChips('pg-' + k)]).filter(([, v]) => v.length));
    await api('/config/access', { method: 'PUT', body: a });
    toast('✅ Akses disimpan — berlaku langsung');
  });
};


// ================== efek animasi ==================
const fx = (() => {
  const calm = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let booted = false; const t0 = Date.now();
  const hideIntro = () => { const el = $('#intro'); if (!el) return; setTimeout(() => { el.classList.add('out'); setTimeout(() => el.remove(), 700); }, calm ? 0 : Math.max(0, 1700 - (Date.now() - t0))); };
  document.addEventListener('click', (e) => { if (e.target.closest('#intro')) $('#intro')?.classList.add('out'); }, true);

  // angka naik
  const countUp = (el) => {
    const node = [...el.childNodes].find((n) => n.nodeType === 3 && /^\s*\d+\s*$/.test(n.textContent)); if (!node) return;
    const end = +node.textContent, dur = 900, st = performance.now();
    const step = (now) => { const k = Math.min(1, (now - st) / dur), e = 1 - Math.pow(1 - k, 3); node.textContent = Math.round(end * e); if (k < 1) requestAnimationFrame(step); };
    node.textContent = '0'; requestAnimationFrame(step);
  };

  const page = () => {
    const root = $('#root');
    if (!booted) { root.firstElementChild?.classList.add('boot'); booted = true; setTimeout(() => root.firstElementChild?.classList.remove('boot'), 2200); }
    root.querySelectorAll('.nav a,.navgroup').forEach((a, i) => a.style.setProperty('--i', i));
    const c = $('.content'); if (!c) return;
    [...c.children].forEach((el, i) => el.style.setProperty('--i', Math.min(i, 8)));
    c.querySelectorAll('.grid').forEach((g) => [...g.children].forEach((el, j) => el.style.setProperty('--j', Math.min(j, 12))));
    const h = c.querySelector('h1'); if (h) h.classList.add('shine');
    if (!calm) c.querySelectorAll('.stat .num:not(.emo)').forEach(countUp);
  };

  // cahaya ikut kursor di kartu
  document.addEventListener('pointermove', (e) => {
    const el = e.target.closest?.('.tile,.feat,.card.stat'); if (!el) return;
    const r = el.getBoundingClientRect(); el.style.setProperty('--mx', e.clientX - r.left + 'px'); el.style.setProperty('--my', e.clientY - r.top + 'px');
  }, { passive: true });

  // riak klik di tombol
  document.addEventListener('pointerdown', (e) => {
    if (calm) return; const b = e.target.closest?.('button,a.btn'); if (!b) return;
    const r = b.getBoundingClientRect(), d = Math.max(r.width, r.height), sp = document.createElement('span');
    sp.className = 'ripple'; sp.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    b.append(sp); setTimeout(() => sp.remove(), 650);
  });

  // partikel emas melayang (ringan, berhenti saat tab tidak aktif)
  const cv = $('#motes');
  if (cv && !calm) {
    const ctx = cv.getContext('2d'); let W, H, dots = [];
    const size = () => { const dpr = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + 'px'; cv.style.height = H + 'px'; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      dots = Array.from({ length: Math.round(W * H / 38000) }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.6 + .4, v: Math.random() * .25 + .06, a: Math.random() * Math.PI * 2, s: Math.random() * .02 + .005 })); };
    size(); addEventListener('resize', size);
    const tick = () => {
      if (!document.hidden) {
        ctx.clearRect(0, 0, W, H);
        for (const d of dots) {
          d.y -= d.v; d.a += d.s; d.x += Math.sin(d.a) * .25; if (d.y < -5) { d.y = H + 5; d.x = Math.random() * W; }
          const o = .25 + Math.sin(d.a * 2) * .2;
          ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, 7); ctx.fillStyle = `rgba(233,209,139,${o})`; ctx.shadowColor = 'rgba(233,209,139,.8)'; ctx.shadowBlur = 6; ctx.fill();
        }
      }
      requestAnimationFrame(tick);
    };
    tick();
  }
  return { page, hideIntro };
})();

// ================== router ==================
function render() {
  const [page, sub] = (location.hash.slice(1) || 'home').split('/');
  S.page = pages[page] && (S.me.pages || []).includes(page) ? page : 'home';
  if (S.page === 'posts' && sub) S.postKey = sub;
  $('#root').innerHTML = layout(pages[S.page]());
  pages[S.page].init?.();
  window.scrollTo(0, 0);
  fx.page();
}
window.onhashchange = render;

function loginScreen() {
  const err = new URLSearchParams(location.search).get('error');
  const msg = { noaccess: '⛔ Akun kamu tidak punya akses. Dashboard hanya untuk staff dengan izin "Manage Server" di THE RESILIENT ORDER.', state: 'Sesi login kadaluarsa, coba lagi.', token: 'Login gagal (cek CLIENT_SECRET & Redirect di Developer Portal).', login: 'Login gagal, coba lagi.' }[err];
  $('#root').innerHTML = `<div class="login"><div class="box"><div class="owl"></div><h1>TRO SYSTEM</h1><div class="motto">In wisdom, we endure.</div><p>Ruang kendali The Resilient Order.<br>Masuk dengan akun Discord kamu.</p>${msg ? `<div class="err-box">${msg}</div>` : ''}<a class="btn" href="/login"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.3 18.3 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a20 20 0 0 0 6 3l1.3-2a12.8 12.8 0 0 1-2-1l.5-.3a14.2 14.2 0 0 0 12.2 0l.5.3-2 1 1.3 2a19.9 19.9 0 0 0 6-3c.5-5.2-.9-9.7-3.6-13.7ZM8 15.4c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4Z"/></svg>Login dengan Discord</a></div></div>`;
}

(async () => {
  S.me = await api('/me').catch(() => ({ user: null }));
  if (!S.me.allowed) { loginScreen(); return fx.hideIntro(); }
  [S.guild, S.cfg] = await Promise.all([api('/guild'), api('/config')]);
  if (!S.guild.channels) { $('#root').innerHTML = '<div class="login"><div class="box"><div class="owl">🦉</div><h1>Bot belum siap</h1><p>TRO SYSTEM masih menyambung ke Discord. Refresh halaman ini sebentar lagi.</p></div></div>'; return fx.hideIntro(); }
  const [apps, inv] = await Promise.all([api('/applications').catch(() => []), api('/invites').catch(() => null)]);
  S.pending = apps.filter((a) => a.status === 'pending').length;
  if (inv) { S.invToday = inv.items.filter((i) => i.date === inv.today).length; S.cfg.invitesLimit = [0, 6].includes(new Date(inv.today + 'T00:00:00Z').getUTCDay()) ? (inv.weekendLimit || '∞') : (inv.weekdayLimit || '∞'); }
  if (location.search) history.replaceState(null, '', '/' + location.hash);
  render();
  fx.hideIntro();
})();
</script>
